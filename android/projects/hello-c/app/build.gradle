plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.nybo.helloc'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.nybo.helloc'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
